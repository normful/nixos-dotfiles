[providers.aihubmix]
outputToPiModelsJson = true
authHeader = true
models = [
  "cc-minimax-m2.5",
  "cc-minimax-m2.5-highspeed",
  "cc-glm-5",
  "kimi-k2.5",
  "gpt-5.3-codex",
  "gemini-3.1-pro-preview-customtools",
]

[providers.aihubmix.model."cc-minimax-m2.5"]
name = "Claude Code MiniMax-M2.5"
compat = { supportsDeveloperRole = false, maxTokensField = "max_tokens" }

[providers.aihubmix.model."cc-minimax-m2.5-highspeed"]
name = "Claude Code MiniMax-M2.5 Highspeed"
compat = { supportsDeveloperRole = false, maxTokensField = "max_tokens" }

[providers.aihubmix.model."cc-glm-5"]
name = "Claude Code GLM-5"
compat = { supportsDeveloperRole = false, maxTokensField = "max_tokens" }

[providers.aihubmix.model."gemini-3.1-pro-preview"]
name = "Gemini 3.1 Pro Preview"
compat = { supportsDeveloperRole = false }

[providers.opencode]
outputToPiModelsJson = false
models = [
  "trinity-large-preview-free",
]

[providers.openrouter]
outputToPiModelsJson = true
models = [
  # A reasoning model designed for speed. It is built for coding assistants,
  # real-time conversational applications, and agentic workflows.
  "openrouter/aurora-alpha",

  # Step 3.5 Flash is StepFun's most capable open-source foundation model. Built
  # on a sparse Mixture of Experts (MoE) architecture, it selectively activates
  # only 11B of its 196B parameters per token. It is a reasoning model that is
  # incredibly speed efficient even at long contexts.
  "stepfun/step-3.5-flash:free",

  # Trinity-Large-Preview is a frontier-scale open-weight language model from
  # Arcee, built as a 400B-parameter sparse Mixture-of-Experts with 13B active
  # parameters per token using 4-of-256 expert routing.
  #
  # It excels in creative writing, storytelling, role-play, chat scenarios, and
  # real-time voice assistance, better than your average reasoning model usually
  # can. But we're also introducing some of our newer agentic performance. It was
  # trained to navigate well in agent harnesses like OpenCode, Cline, and Kilo
  # Code, and to handle complex toolchains and long, constraint-filled prompts.
  #
  # The architecture natively supports very long context windows up to 512k tokens,
  # with the Preview API currently served at 128k context using 8-bit quantization
  # for practical deployment. Trinity-Large-Preview reflects Arcee's
  # efficiency-first design philosophy, offering a production-oriented frontier
  # model with open weights and permissive licensing suitable for real-world
  # applications and experimentation.
  "arcee-ai/trinity-large-preview:free",

  # Trinity Mini is a 26B-parameter (3B active) sparse mixture-of-experts
  # language model featuring 128 experts with 8 active per token. Engineered for
  # efficient reasoning over long contexts (131k) with robust function calling
  # and multi-step agent workflows.
  "arcee-ai/trinity-mini:free",
]

[providers.cerebras]
outputToPiModelsJson = false
models = [
  "llama3.1-8b", # $0.10/M input tokens
  "gpt-oss-120b", # $0.35/M input tokens
]
