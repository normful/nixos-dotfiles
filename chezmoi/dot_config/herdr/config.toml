onboarding = false

[theme]
name = "dracula"

[terminal]
new_cwd = "follow"

[update]
version_check = false
manifest_check = false

[keys]
prefix = "alt+l"

# Workspace management
new_workspace = ["prefix+n"]
previous_workspace = ["f9"]
next_workspace = ["f10"]
rename_workspace = ["prefix+r"]
close_workspace = ["prefix+q"]

# Tab management
new_tab = ["f8", "prefix+t"]
previous_tab = ["f11"]
next_tab = ["f12"]
close_tab = ["prefix+z"]

# Agent pane navigation
previous_agent = ["super+-"]
next_agent = ["super+="]

# Pane management
split_horizontal = ["prefix+s"]
split_vertical = ["prefix+v"]
cycle_pane_next = ["prefix+p"]
close_pane = ["prefix+x"]

# Navigation & misc
goto = ["super+g"]
new_worktree = ["super+y"]
edit_scrollback = ["alt+e"]
help = ["prefix+?"]
detach = ["prefix+d"]

[[keys.command]]
key = "f2"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"

[[keys.command]]
key = "f6"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]
key = "f7"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "herdr plugin action invoke herdr-spreader.apply"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
sidebar_min_width = 34
mouse_scroll_lines = 5
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
pane_borders = false
pane_gaps = false
agent_panel_sort = "priority"

[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
delivery = "terminal"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 10000000

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = false
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["pi"]
cjk_ime_cursor_shape = "steady_block"
