onboarding = false

[theme]
name = "dracula"

[terminal]
new_cwd = "follow"

[update]
version_check = false
manifest_check = false

[keys]
prefix = "alt+l"

# Workspace management
new_workspace = ["shift+alt+n", "shift+alt+c", "prefix+n", "prefix+c"]
previous_workspace = ["shift+alt+w", "f9", "prefix+w"]
next_workspace = ["shift+alt+s", "f10", "prefix+s"]
rename_workspace = ["shift+alt+r", "prefix+r"]
close_workspace = ["shift+alt+x"]

# Tab management
new_tab = ["f8", "prefix+t"]
previous_tab = ["f11", "prefix+q"]
next_tab = ["f12", "prefix+e"]
close_tab = ["prefix+x"]

# Agent pane navigation
previous_agent = ["alt+1", "prefix+1"]
next_agent = ["alt+2", "prefix+2"]

# Pane management
cycle_pane_next = ["prefix+p"]

# Navigation & misc
goto = ["super+g", "prefix+g"]
new_worktree = ["prefix+y"]
edit_scrollback = ["alt+e", "prefix+e"]
remote_image_paste = "ctrl+v"
help = ["prefix+?"]
detach = ["prefix+d"]

[[keys.command]]
key = "f2"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"

[[keys.command]]
key = "f4"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]
key = "f5"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
sidebar_min_width = 34
mouse_scroll_lines = 5
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
pane_borders = false
pane_gaps = false
agent_panel_sort = "priority"

[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
delivery = "terminal"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 10000000

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = false
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["pi"]
cjk_ime_cursor_shape = "steady_block"
