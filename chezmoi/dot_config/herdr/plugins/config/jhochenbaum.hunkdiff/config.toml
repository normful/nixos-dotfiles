[review]
auto_open = true # Opens or refreshes a review when an associated agent enters the following states:
on_states = ["idle", "blocked", "unknown"]

reuse_pane = true
watch = true
placement = "tab"

[roundtrip]
clear_after_send = false

[hunk]
bin = "hunk"
experimental = true # Passes Hunk's --experimental option, currently including support for STML-rendered agent notes.
